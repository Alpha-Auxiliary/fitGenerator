[package]
name = "fit-generator-core"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
android-jni = ["dep:jni"]

[dependencies]
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
jni = { version = "0.21", optional = true }

[dev-dependencies]
fitparser = "0.10"
proptest = "1"
