name: Native CI

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".cargo/**"
      - "android/**"
      - "core-rust/**"
      - "deny.toml"
      - "global.json"
      - "native-windows/**"
      - "rust-toolchain*"
      - "scripts/build-rust-android.sh"
      - "scripts/build-rust-windows.ps1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".cargo/**"
      - "android/**"
      - "core-rust/**"
      - "deny.toml"
      - "global.json"
      - "native-windows/**"
      - "rust-toolchain*"
      - "scripts/build-rust-android.sh"
      - "scripts/build-rust-windows.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Require reviewed Cargo.lock
        shell: bash
        run: |
          if [[ ! -s core-rust/Cargo.lock ]]; then
            echo "::error file=core-rust/Cargo.lock::Missing reviewed Cargo.lock. Generate it in a trusted development environment, review it, and commit it; CI will not generate it."
            exit 1
          fi

      - name: Set up Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action for Rust 1.97.1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core-rust
          key: "${{ runner.os }}-rust-${{ hashFiles('core-rust/Cargo.lock', 'core-rust/Cargo.toml', 'deny.toml', '.github/workflows/ci.yml') }}"
          save-if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"

      - name: Install cargo-deny 0.19.9
        shell: bash
        run: cargo install cargo-deny --version 0.19.9 --locked

      - name: Check Rust formatting
        shell: bash
        run: cargo fmt --manifest-path core-rust/Cargo.toml --check

      - name: Lint Rust
        shell: bash
        run: >-
          cargo clippy --manifest-path core-rust/Cargo.toml
          --all-targets --all-features --locked -- -D warnings

      - name: Test Rust
        shell: bash
        run: >-
          cargo test --manifest-path core-rust/Cargo.toml
          --all-features --locked

      - name: Check locked Rust licenses, bans, and sources
        shell: bash
        run: >-
          cargo deny --manifest-path core-rust/Cargo.toml
          --all-features --locked check bans licenses sources

      - name: Check current Rust security advisories without rewriting the lock
        shell: bash
        run: |
          cargo deny --manifest-path core-rust/Cargo.toml --all-features check advisories
          if ! git diff --quiet -- core-rust/Cargo.lock; then
            echo "::error file=core-rust/Cargo.lock::cargo-deny changed the reviewed lock file. Regenerate and review it in a trusted development environment."
            exit 1
          fi

  windows:
    name: Windows portable
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Require reviewed Cargo.lock
        shell: pwsh
        run: |
          $lockPath = "core-rust/Cargo.lock"
          if (
            -not (Test-Path -LiteralPath $lockPath -PathType Leaf) -or
            (Get-Item -LiteralPath $lockPath).Length -le 0
          ) {
            [Console]::Error.WriteLine(
              "::error file=core-rust/Cargo.lock::Missing reviewed Cargo.lock. " +
              "Generate it in a trusted development environment, review it, and commit it; " +
              "CI will not generate it."
            )
            exit 1
          }

      - name: Set up Rust 1.97.1 for Windows x64
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action for Rust 1.97.1
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core-rust
          key: "${{ runner.os }}-windows-msvc-${{ hashFiles('core-rust/Cargo.lock', 'core-rust/Cargo.toml', 'scripts/build-rust-windows.ps1', 'native-windows/**/*.csproj', '.github/workflows/ci.yml') }}"
          save-if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"

      - name: Set up .NET SDK 8.0.423
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.423"

      - name: Build Windows Rust core
        shell: pwsh
        run: >-
          pwsh -NoProfile -File scripts/build-rust-windows.ps1
          -Configuration Release

      - name: Restore Windows tests
        shell: pwsh
        run: >-
          dotnet restore
          native-windows/FitGenerator.Native.Tests/FitGenerator.Native.Tests.csproj

      - name: Test Windows client
        shell: pwsh
        run: >-
          dotnet test
          native-windows/FitGenerator.Native.Tests/FitGenerator.Native.Tests.csproj
          -c Release --no-restore

      - name: Restore Windows portable client
        shell: pwsh
        run: >-
          dotnet restore
          native-windows/FitGenerator.Native/FitGenerator.Native.csproj
          -r win-x64

      - name: Publish Windows portable client
        shell: pwsh
        run: >-
          dotnet publish
          native-windows/FitGenerator.Native/FitGenerator.Native.csproj
          -c Release -r win-x64 --no-restore

      - name: Verify Windows portable output and self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $publishDirectory = "native-windows/FitGenerator.Native/bin/Release/net8.0-windows/win-x64/publish"
          $executables = @(
            Get-ChildItem -LiteralPath $publishDirectory -Filter "*.exe" -File
          )
          if ($executables.Count -ne 1 -or $executables[0].Length -le 0) {
            throw "Expected exactly one nonempty Windows portable EXE."
          }
          $adjacentDlls = @(
            Get-ChildItem -LiteralPath $publishDirectory -Filter "*.dll" -File
          )
          if ($adjacentDlls.Count -ne 0) {
            throw "Windows portable output must not contain adjacent DLL files."
          }
          $executable = $executables[0]
          $stream = $null
          $reader = $null
          try {
            $stream = [System.IO.File]::Open(
              $executable.FullName,
              [System.IO.FileMode]::Open,
              [System.IO.FileAccess]::Read,
              [System.IO.FileShare]::Read
            )
            $reader = New-Object -TypeName System.IO.BinaryReader -ArgumentList (, $stream)
            if ($stream.Length -lt 90) {
              throw "Windows portable EXE is too small to contain a valid PE header."
            }
            if ($reader.ReadByte() -ne 0x4D -or $reader.ReadByte() -ne 0x5A) {
              throw "Windows portable EXE does not have an MZ header."
            }
            $stream.Position = 0x3C
            $peOffset = $reader.ReadInt32()
            if ($peOffset -lt 64 -or ([Int64]$peOffset + 26) -gt $stream.Length) {
              throw "Windows portable EXE has an invalid PE header offset."
            }
            $stream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x00004550) {
              throw "Windows portable EXE does not have a PE signature."
            }
            if ($reader.ReadUInt16() -ne 0x8664) {
              throw "Windows portable EXE is not AMD64."
            }
            $stream.Position = $peOffset + 20
            $optionalHeaderSize = $reader.ReadUInt16()
            if (
              $optionalHeaderSize -lt 2 -or
              ([Int64]$peOffset + 24 + $optionalHeaderSize) -gt $stream.Length
            ) {
              throw "Windows portable EXE has an invalid optional header."
            }
            $stream.Position = $peOffset + 22
            $characteristics = $reader.ReadUInt16()
            if (
              ($characteristics -band 0x0002) -eq 0 -or
              ($characteristics -band 0x2000) -ne 0
            ) {
              throw "Windows portable EXE is not an executable PE application."
            }
            $stream.Position = $peOffset + 24
            if ($reader.ReadUInt16() -ne 0x020B) {
              throw "Windows portable EXE is not PE32+."
            }
          } finally {
            if ($null -ne $reader) {
              $reader.Dispose()
            } elseif ($null -ne $stream) {
              $stream.Dispose()
            }
          }
          & $executable.FullName --self-test
          $selfTestExitCode = $LASTEXITCODE
          if ($selfTestExitCode -ne 0) {
            exit $selfTestExitCode
          }

  android:
    name: Android native
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Require reviewed Cargo.lock
        shell: bash
        run: |
          if [[ ! -s core-rust/Cargo.lock ]]; then
            echo "::error file=core-rust/Cargo.lock::Missing reviewed Cargo.lock. Generate it in a trusted development environment, review it, and commit it; CI will not generate it."
            exit 1
          fi

      - name: Set up Rust 1.97.1 for Android
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action for Rust 1.97.1
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core-rust
          key: "${{ runner.os }}-android-${{ hashFiles('core-rust/Cargo.lock', 'core-rust/Cargo.toml', 'scripts/build-rust-android.sh', 'android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties', '.github/workflows/ci.yml') }}"
          save-if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"

      - name: Install cargo-ndk 3.5.4
        shell: bash
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - name: Set up Java 17.0.19+10
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17.0.19+10"
          check-latest: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install fixed Android SDK and NDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
          ndk_home="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          if [[ ! -f "$ndk_home/source.properties" ]]; then
            echo "::error::Android NDK 27.2.12479018 was not installed at the expected SDK path."
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.11.1 wrapper and cache
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: wrapper
          validate-wrappers: true
          cache-read-only: "${{ github.event_name == 'pull_request' }}"

      - name: Build Android Rust core
        shell: bash
        run: bash scripts/build-rust-android.sh

      - name: Test, lint, and assemble Android debug client
        shell: bash
        run: >-
          ./android/gradlew -p android --no-daemon
          testDebugUnitTest lintDebug assembleDebug

      - name: Verify Android debug APK packaging
        shell: bash
        run: |
          set -euo pipefail
          apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$apk_path" ]]; then
            echo "::error file=$apk_path::Android debug APK is missing or empty."
            exit 1
          fi
          unzip -tqq "$apk_path"
          apk_entries="$(unzip -Z1 "$apk_path")"
          expected_abis=$'arm64-v8a\nx86_64'
          actual_abis="$(
            printf '%s\n' "$apk_entries" |
              awk -F/ '$1 == "lib" && NF >= 3 { print $2 }' |
              LC_ALL=C sort -u
          )"
          if [[ "$actual_abis" != "$expected_abis" ]]; then
            echo "::error file=$apk_path::APK native ABI set must be exactly arm64-v8a and x86_64."
            exit 1
          fi
          for entry in \
            lib/arm64-v8a/libfit_generator_core.so \
            lib/x86_64/libfit_generator_core.so
          do
            entry_count="$(
              printf '%s\n' "$apk_entries" |
                awk -v expected="$entry" '$0 == expected { count += 1 } END { print count + 0 }'
            )"
            if [[ "$entry_count" -ne 1 ]]; then
              echo "::error file=$apk_path::APK must contain exactly one $entry."
              exit 1
            fi
            entry_size="$(unzip -p "$apk_path" "$entry" | wc -c)"
            if [[ "$entry_size" -le 0 ]]; then
              echo "::error file=$apk_path::APK must contain a nonempty $entry."
              exit 1
            fi
          done
