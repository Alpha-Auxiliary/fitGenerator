name: Native Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag
        required: true
        type: string
      dry_run:
        description: Build and test unsigned diagnostics without secrets, signing, attesting, or publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: "native-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      publish_release: ${{ steps.release.outputs.publish_release }}
    steps:
      - name: Check out requested tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag, commit, versions, and release prerequisites
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_TAG: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
          REQUESTED_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            [[ "$EVENT_REF" == refs/tags/* ]] || {
              echo "::error::Release workflow push events must be tag events."
              exit 1
            }
            release_tag="$EVENT_TAG"
            publish_release=true
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$REQUESTED_TAG"
            case "$DRY_RUN" in
              true) publish_release=false ;;
              *) echo "::error::Manual invocations are restricted to dry_run=true."; exit 1 ;;
            esac
          else
            echo "::error::Unsupported release event."
            exit 1
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vMAJOR.MINOR.PATCH."
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$release_tag"; then
            echo "::error::The requested release ref must be an existing Git tag."
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "$release_tag^{commit}")"
          head_commit="$(git rev-parse --verify HEAD)"
          if [[ ! "$tag_commit" =~ ^[0-9a-f]{40}$ || "$tag_commit" != "$head_commit" ]]; then
            echo "::error::The requested tag must resolve to the checked-out commit."
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" && "$tag_commit" != "$EVENT_SHA" ]]; then
            echo "::error::The pushed tag does not resolve to the workflow event commit."
            exit 1
          fi
          main_commit="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          if ! git merge-base --is-ancestor "$tag_commit" "$main_commit"; then
            echo "::error::Release tags must point to commits contained in origin/main."
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::The checked-out release source is not clean."
            exit 1
          fi
          if [[ ! -s core-rust/Cargo.lock ]]; then
            echo "::error file=core-rust/Cargo.lock::A reviewed Cargo.lock is required. The release workflow will not generate one."
            exit 1
          fi
          if [[ -e .github/workflows/build.yml ]]; then
            echo "::error file=.github/workflows/build.yml::The legacy workflow still publishes tag releases. Verify replacement CI, remove it in a reviewed change, and only then create a release tag."
            exit 1
          fi
          release_version="${release_tag#v}"
          package_version="$(jq -er '.version | select(type == "string")' package.json)"
          mapfile -t cargo_versions < <(
            sed -nE '/^\[package\][[:space:]]*$/,/^\[[^]]+\][[:space:]]*$/{s/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p;}' core-rust/Cargo.toml
          )
          mapfile -t android_versions < <(
            sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)"[[:space:]]*$/\1/p' android/app/build.gradle
          )
          if [[ "${#cargo_versions[@]}" -ne 1 ]]; then
            echo "::error file=core-rust/Cargo.toml::Expected exactly one package version."
            exit 1
          fi
          if [[ "${#android_versions[@]}" -ne 1 ]]; then
            echo "::error file=android/app/build.gradle::Expected exactly one literal Android versionName."
            exit 1
          fi
          if [[ "$package_version" != "$release_version" ]]; then
            echo "::error file=package.json::package.json version must equal the release tag version."
            exit 1
          fi
          if [[ "${cargo_versions[0]}" != "$release_version" ]]; then
            echo "::error file=core-rust/Cargo.toml::Rust package version must equal the release tag version."
            exit 1
          fi
          if [[ "${android_versions[0]}" != "$release_version" ]]; then
            echo "::error file=android/app/build.gradle::Android versionName must equal the release tag version."
            exit 1
          fi
          {
            echo "release_tag=$release_tag"
            echo "release_version=$release_version"
            echo "source_commit=$tag_commit"
            echo "publish_release=$publish_release"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Build unsigned Android diagnostic
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      file_sha256: ${{ steps.package.outputs.file_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out validated source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Set up Rust 1.97.1 for Android
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # Rust 1.97.1
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core-rust
          key: "${{ runner.os }}-release-android-${{ hashFiles('core-rust/Cargo.lock', 'core-rust/Cargo.toml', 'scripts/build-rust-android.sh', 'android/app/build.gradle', 'android/build.gradle', 'android/settings.gradle', 'android/gradle/wrapper/gradle-wrapper.properties', '.github/workflows/release.yml') }}"
          save-if: "false"

      - name: Install cargo-ndk 3.5.4
        shell: bash
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - name: Set up Java 17.0.19+10
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17.0.19+10"
          check-latest: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install fixed Android SDK and NDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
          ndk_home="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          [[ -f "$ndk_home/source.properties" ]] || {
            echo "::error::Android NDK 27.2.12479018 is missing."
            exit 1
          }
          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.11.1 wrapper and cache
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: wrapper
          validate-wrappers: true
          cache-read-only: true

      - name: Build Android Rust core
        shell: bash
        run: bash scripts/build-rust-android.sh

      - name: Test, lint, and assemble unsigned Android release
        shell: bash
        run: >-
          ./android/gradlew -p android --no-daemon
          testReleaseUnitTest lintRelease assembleRelease

      - name: Prepare fixed Android artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          source_path="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          file_name="fit-generator-android-UNSIGNED.apk"
          [[ -s "$source_path" ]] || { echo "::error file=$source_path::Expected APK is missing or empty."; exit 1; }
          cp -- "$source_path" "release-output/$file_name"
          file_sha256="$(sha256sum "release-output/$file_name" | awk '{ print $1 }')"
          [[ "$file_sha256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          echo "file_sha256=$file_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned Android diagnostic
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-unsigned
          path: release-output/fit-generator-android-UNSIGNED.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false
          overwrite: false

  windows:
    name: Build unsigned Windows release
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
    outputs:
      file_sha256: ${{ steps.package.outputs.file_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out validated source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Set up Rust 1.97.1 for Windows x64
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # Rust 1.97.1
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core-rust
          key: "${{ runner.os }}-release-windows-${{ hashFiles('core-rust/Cargo.lock', 'core-rust/Cargo.toml', 'scripts/build-rust-windows.ps1', 'native-windows/FitGenerator.Native/FitGenerator.Native.csproj', 'native-windows/FitGenerator.Native.Tests/FitGenerator.Native.Tests.csproj', '.github/workflows/release.yml') }}"
          save-if: "false"

      - name: Set up .NET SDK 8.0.423
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.423"

      - name: Test Rust core on Windows
        shell: pwsh
        run: >-
          cargo test --manifest-path core-rust/Cargo.toml
          --all-features --locked

      - name: Build Windows Rust core
        shell: pwsh
        run: >-
          pwsh -NoProfile -File scripts/build-rust-windows.ps1
          -Configuration Release

      - name: Restore and test Windows client
        shell: pwsh
        run: |
          dotnet restore native-windows/FitGenerator.Native.Tests/FitGenerator.Native.Tests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test native-windows/FitGenerator.Native.Tests/FitGenerator.Native.Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish Windows portable client
        shell: pwsh
        run: |
          dotnet restore native-windows/FitGenerator.Native/FitGenerator.Native.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish native-windows/FitGenerator.Native/FitGenerator.Native.csproj `
            -c Release -r win-x64 --no-restore "-p:Version=$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and package unsigned Windows EXE
        id: package
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $publishDirectory = "native-windows/FitGenerator.Native/bin/Release/net8.0-windows/win-x64/publish"
          $files = @(Get-ChildItem -LiteralPath $publishDirectory -File -Force)
          if ($files.Count -ne 1 -or $files[0].Name -cne "FitGenerator.Native.exe" -or $files[0].Length -le 0) {
            throw "Windows publish must contain exactly one nonempty FitGenerator.Native.exe."
          }
          if ($env:RELEASE_VERSION -cnotmatch "^[0-9]+[.][0-9]+[.][0-9]+$") {
            throw "Validated Windows release version is invalid."
          }
          $expectedFileVersion = "$env:RELEASE_VERSION.0"
          if ($files[0].VersionInfo.FileVersion -cne $expectedFileVersion) {
            throw "Windows EXE file version does not match the release tag."
          }
          & $files[0].FullName --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $outputDirectory = New-Item -ItemType Directory -Path "release-output" -Force
          $outputPath = Join-Path $outputDirectory.FullName "fit-generator-windows-x64-UNSIGNED.exe"
          Copy-Item -LiteralPath $files[0].FullName -Destination $outputPath
          $hash = (Get-FileHash -LiteralPath $outputPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cnotmatch "^[0-9a-f]{64}$") { throw "Unable to calculate Windows SHA-256." }
          "file_sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload unsigned Windows artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-unsigned
          path: release-output/fit-generator-windows-x64-UNSIGNED.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false
          overwrite: false

  sign_windows:
    name: Optionally sign Windows release
    needs: [prepare, windows]
    if: needs.prepare.outputs.publish_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      actions: read
    outputs:
      signed: ${{ steps.result.outputs.signed }}
      file_sha256: ${{ steps.verify_signed.outputs.file_sha256 }}
      artifact_id: ${{ steps.upload_signed.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_signed.outputs.artifact-digest }}
    steps:
      - name: Decide whether SignPath is available
        id: decision
        shell: pwsh
        env:
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
          SIGNPATH_API_TOKEN_VALUE: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID_VALUE: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        run: |
          Set-StrictMode -Version Latest
          $enabled = $env:SIGNPATH_ENABLED -ceq "true"
          $complete = (
            -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN_VALUE) -and
            -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID_VALUE)
          )
          if ($enabled -and $complete) {
            "can_sign=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "can_sign=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            if ($enabled) {
              Write-Warning "SignPath is enabled but protected configuration is incomplete; using explicit UNSIGNED fallback."
            } else {
              Write-Output "SignPath is disabled; using explicit UNSIGNED fallback."
            }
          }

      - name: Submit fixed unsigned artifact to SignPath
        id: signpath
        if: steps.decision.outputs.can_sign == 'true'
        continue-on-error: true
        uses: SignPath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: fit-generator
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.windows.outputs.artifact_id }}
          wait-for-completion: true
          output-artifact-directory: signpath-output

      - name: Validate returned Authenticode artifact
        id: verify_signed
        if: steps.decision.outputs.can_sign == 'true' && steps.signpath.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $root = [System.IO.Path]::GetFullPath("signpath-output")
          $rootItem = Get-Item -LiteralPath $root -Force
          if (-not $rootItem.PSIsContainer) { throw "SignPath did not return an artifact directory." }
          $entries = @(Get-ChildItem -LiteralPath $root -Recurse -Force)
          $reparsePoints = @(
            $entries | Where-Object {
              ($_.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0
            }
          )
          if ($reparsePoints.Count -gt 0) { throw "SignPath output contains a reparse point." }
          $files = @($entries | Where-Object { -not $_.PSIsContainer })
          if ($files.Count -ne 1 -or $files[0].Extension -cne ".exe" -or $files[0].Length -le 0) {
            throw "SignPath output must contain exactly one nonempty EXE."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $files[0].FullName
          if ($signature.Status.ToString() -cne "Valid") {
            throw "SignPath output does not have a valid Authenticode signature."
          }
          $outputDirectory = New-Item -ItemType Directory -Path "release-output" -Force
          $outputPath = Join-Path $outputDirectory.FullName "fit-generator-windows-x64.exe"
          Copy-Item -LiteralPath $files[0].FullName -Destination $outputPath
          $hash = (Get-FileHash -LiteralPath $outputPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cnotmatch "^[0-9a-f]{64}$") { throw "Unable to calculate signed Windows SHA-256." }
          "file_sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload signed Windows artifact
        id: upload_signed
        if: steps.verify_signed.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          path: release-output/fit-generator-windows-x64.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false
          overwrite: false

      - name: Record Windows signing result
        id: result
        if: always()
        shell: pwsh
        env:
          CAN_SIGN: ${{ steps.decision.outputs.can_sign }}
          SIGNPATH_OUTCOME: ${{ steps.signpath.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_signed.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_signed.outcome }}
        run: |
          $signed = $env:UPLOAD_OUTCOME -ceq "success"
          if ($env:CAN_SIGN -ceq "true" -and -not $signed) {
            Write-Warning (
              "SignPath did not produce a verified uploaded artifact " +
              "(submit=$env:SIGNPATH_OUTCOME, verify=$env:VERIFY_OUTCOME, upload=$env:UPLOAD_OUTCOME); " +
              "using explicit UNSIGNED fallback."
            )
          }
          "signed=$($signed.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  assemble_release:
    name: Assemble and verify release bundle
    needs: [prepare, android, windows, sign_windows]
    if: needs.prepare.outputs.publish_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      windows_signed: ${{ needs.sign_windows.outputs.signed }}
    steps:
      - name: Check out validated source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Set up Java 17.0.19+10
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17.0.19+10"
          check-latest: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install fixed apksigner
        shell: pwsh
        run: |
          sdkmanager "build-tools;35.0.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $buildTools = Join-Path $env:ANDROID_SDK_ROOT "build-tools/35.0.0"
          $apkSigner = Join-Path $buildTools "apksigner.bat"
          if (-not (Test-Path -LiteralPath $apkSigner -PathType Leaf)) {
            throw "Fixed apksigner 35.0.0 is unavailable."
          }
          $buildTools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download unsigned Android artifact by ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.android.outputs.artifact_id }}
          path: release-input
          merge-multiple: true

      - name: Verify unsigned Android transfer
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.android.outputs.file_sha256 }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.android.outputs.artifact_digest }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $inputPath = "release-input/fit-generator-android-UNSIGNED.apk"
          $items = @(Get-ChildItem -LiteralPath "release-input" -Force)
          if (
            $items.Count -ne 1 -or
            $items[0].PSIsContainer -or
            $items[0].Name -cne "fit-generator-android-UNSIGNED.apk" -or
            ($items[0].Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0 -or
            $items[0].Length -le 0
          ) {
            throw "Unsigned Android artifact has an unexpected layout."
          }
          if ($env:EXPECTED_SHA256 -cnotmatch "^[0-9a-f]{64}$") {
            throw "Upstream Android SHA-256 is invalid."
          }
          if ($env:EXPECTED_ARTIFACT_DIGEST -cnotmatch "^[0-9a-fA-F]{64}$") {
            throw "Upstream Android artifact digest is invalid."
          }
          $actualHash = (Get-FileHash -LiteralPath $inputPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne $env:EXPECTED_SHA256) {
            throw "Unsigned Android artifact SHA-256 changed across jobs."
          }

      - name: Require complete Android signing inputs
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) { $missing += "ANDROID_KEYSTORE_BASE64" }
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_PASSWORD)) { $missing += "ANDROID_KEYSTORE_PASSWORD" }
          if ([string]::IsNullOrWhiteSpace($env:KEY_ALIAS)) { $missing += "ANDROID_KEY_ALIAS" }
          if ([string]::IsNullOrWhiteSpace($env:KEY_PASSWORD)) { $missing += "ANDROID_KEY_PASSWORD" }
          if ($missing.Count -ne 0) {
            throw "Android release signing is incomplete ($($missing -join ', ')); the unsigned diagnostic is not publishable."
          }

      - name: Restore Android release keystore
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $keystorePath = Join-Path $env:RUNNER_TEMP "fit-generator-release.jks"
          if (Test-Path -LiteralPath $keystorePath) {
            throw "Temporary Android keystore path already exists."
          }
          try {
            $keystoreBytes = [Convert]::FromBase64String($env:KEYSTORE_BASE64)
          } catch {
            throw "Android keystore secret is not valid Base64."
          }
          if ($keystoreBytes.Length -le 0) { throw "Decoded Android keystore is empty." }
          [System.IO.File]::WriteAllBytes($keystorePath, $keystoreBytes)

      - name: Sign and verify fixed Android artifact
        id: android_signature
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/fit-generator-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $outputDirectory = New-Item -ItemType Directory -Path "release-output" -Force
          $outputPath = Join-Path $outputDirectory.FullName "fit-generator-android.apk"
          $apkSigner = Join-Path $env:ANDROID_SDK_ROOT "build-tools/35.0.0/apksigner.bat"
          & $apkSigner sign `
            --ks $env:ANDROID_KEYSTORE_PATH `
            --ks-key-alias $env:ANDROID_KEY_ALIAS `
            --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" `
            --key-pass "env:ANDROID_KEY_PASSWORD" `
            --out $outputPath `
            "release-input/fit-generator-android-UNSIGNED.apk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $outputPath -PathType Leaf) -or (Get-Item -LiteralPath $outputPath).Length -le 0) {
            throw "Signed Android APK is missing or empty."
          }
          & $apkSigner verify --verbose --print-certs $outputPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -LiteralPath $outputPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cnotmatch "^[0-9a-f]{64}$") { throw "Unable to calculate signed Android SHA-256." }
          "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "file_sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Remove temporary Android keystore
        if: always()
        shell: pwsh
        run: |
          $keystorePath = Join-Path $env:RUNNER_TEMP "fit-generator-release.jks"
          if (Test-Path -LiteralPath $keystorePath -PathType Leaf) {
            Remove-Item -LiteralPath $keystorePath -Force
          }

      - name: Download signed Windows artifact by ID
        if: needs.sign_windows.outputs.signed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.sign_windows.outputs.artifact_id }}
          path: release-output
          merge-multiple: true

      - name: Download unsigned Windows artifact by ID
        if: needs.sign_windows.outputs.signed != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.windows.outputs.artifact_id }}
          path: release-output
          merge-multiple: true

      - name: Verify transferred artifact names and hashes
        shell: pwsh
        env:
          ANDROID_SIGNED: ${{ steps.android_signature.outputs.signed }}
          ANDROID_SHA256: ${{ steps.android_signature.outputs.file_sha256 }}
          WINDOWS_UNSIGNED_SHA256: ${{ needs.windows.outputs.file_sha256 }}
          WINDOWS_UNSIGNED_ARTIFACT_DIGEST: ${{ needs.windows.outputs.artifact_digest }}
          WINDOWS_SIGNED_SHA256: ${{ needs.sign_windows.outputs.file_sha256 }}
          WINDOWS_SIGNED_ARTIFACT_DIGEST: ${{ needs.sign_windows.outputs.artifact_digest }}
          WINDOWS_SIGNED: ${{ needs.sign_windows.outputs.signed }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          if ($env:ANDROID_SIGNED -cne "true") {
            throw "Android signing status was not produced by successful apksigner verification."
          }
          $androidPath = "release-output/fit-generator-android.apk"
          $windowsName = if ($env:WINDOWS_SIGNED -ceq "true") {
            "fit-generator-windows-x64.exe"
          } else {
            "fit-generator-windows-x64-UNSIGNED.exe"
          }
          $windowsPath = Join-Path "release-output" $windowsName
          $topLevelItems = @(Get-ChildItem -LiteralPath "release-output" -Force)
          $unsafeItems = @(
            $topLevelItems | Where-Object {
              $_.PSIsContainer -or
              ($_.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0
            }
          )
          if (
            $topLevelItems.Count -ne 2 -or
            $unsafeItems.Count -ne 0 -or
            -not (Test-Path -LiteralPath $androidPath -PathType Leaf) -or
            -not (Test-Path -LiteralPath $windowsPath -PathType Leaf)
          ) {
            throw "Downloaded artifacts do not match the fixed Android/Windows layout."
          }
          $expectedWindowsHash = if ($env:WINDOWS_SIGNED -ceq "true") {
            $env:WINDOWS_SIGNED_SHA256
          } else {
            $env:WINDOWS_UNSIGNED_SHA256
          }
          $expectedWindowsArtifactDigest = if ($env:WINDOWS_SIGNED -ceq "true") {
            $env:WINDOWS_SIGNED_ARTIFACT_DIGEST
          } else {
            $env:WINDOWS_UNSIGNED_ARTIFACT_DIGEST
          }
          foreach ($expectedHash in @($env:ANDROID_SHA256, $expectedWindowsHash)) {
            if ($expectedHash -cnotmatch "^[0-9a-f]{64}$") {
              throw "An upstream artifact SHA-256 output is invalid."
            }
          }
          foreach ($expectedArtifactDigest in @($expectedWindowsArtifactDigest)) {
            if ($expectedArtifactDigest -cnotmatch "^[0-9a-fA-F]{64}$") {
              throw "An upstream GitHub artifact digest output is invalid."
            }
          }
          $androidHash = (Get-FileHash -LiteralPath $androidPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $windowsHash = (Get-FileHash -LiteralPath $windowsPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($androidHash -cne $env:ANDROID_SHA256 -or $windowsHash -cne $expectedWindowsHash) {
            throw "A downloaded artifact does not match its producing job SHA-256."
          }

      - name: Generate fixed SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release-output
          format: spdx-json
          output-file: release-output/fit-generator-sbom.spdx.json
          syft-version: v1.42.3
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Generate deterministic checksums and metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: |
          pwsh -NoProfile -File scripts/make-release-metadata.ps1 `
            -ReleaseDirectory release-output `
            -ReleaseVersion $env:RELEASE_TAG `
            -SourceCommit $env:SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify complete release bundle
        shell: pwsh
        env:
          WINDOWS_SIGNED: ${{ needs.sign_windows.outputs.signed }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: |
          $arguments = @(
            "-NoProfile",
            "-File", "scripts/verify-release.ps1",
            "-ReleaseDirectory", "release-output",
            "-RequireAndroidSignature"
          )
          if ($env:WINDOWS_SIGNED -ceq "true") { $arguments += "-RequireWindowsSignature" }
          & pwsh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = Get-Content -LiteralPath "release-output/fit-generator-release-metadata.json" -Raw |
            ConvertFrom-Json
          if (
            $metadata.releaseVersion -cne $env:RELEASE_TAG -or
            $metadata.sourceCommit -cne $env:SOURCE_COMMIT
          ) {
            throw "Release metadata does not match the validated tag and source commit."
          }

      - name: Upload verified release bundle
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: release-output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false
          overwrite: false

  publish:
    name: Attest and publish GitHub Release
    needs: [prepare, assemble_release]
    if: needs.prepare.outputs.publish_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    environment: release
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out validated source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 17.0.19+10
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17.0.19+10"
          check-latest: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install fixed apksigner
        shell: pwsh
        run: |
          sdkmanager "build-tools;35.0.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $buildTools = Join-Path $env:ANDROID_SDK_ROOT "build-tools/35.0.0"
          $apkSigner = Join-Path $buildTools "apksigner.bat"
          if (-not (Test-Path -LiteralPath $apkSigner -PathType Leaf)) {
            throw "Fixed apksigner 35.0.0 is unavailable."
          }
          $buildTools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download verified release bundle by ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.assemble_release.outputs.artifact_id }}
          path: release-output
          merge-multiple: true

      - name: Reverify tag, metadata, signatures, and layout
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          WINDOWS_SIGNED: ${{ needs.assemble_release.outputs.windows_signed }}
          EXPECTED_BUNDLE_ARTIFACT_DIGEST: ${{ needs.assemble_release.outputs.artifact_digest }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          if ($env:EXPECTED_BUNDLE_ARTIFACT_DIGEST -cnotmatch "^[0-9a-fA-F]{64}$") {
            throw "Upstream release-bundle artifact digest is invalid."
          }
          $tagCommit = (& git rev-parse --verify "$env:RELEASE_TAG^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $env:SOURCE_COMMIT) {
            throw "Release tag no longer resolves to the validated source commit."
          }
          $arguments = @(
            "-NoProfile",
            "-File", "scripts/verify-release.ps1",
            "-ReleaseDirectory", "release-output",
            "-RequireAndroidSignature"
          )
          if ($env:WINDOWS_SIGNED -ceq "true") { $arguments += "-RequireWindowsSignature" }
          & pwsh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = Get-Content -LiteralPath "release-output/fit-generator-release-metadata.json" -Raw |
            ConvertFrom-Json
          if (
            $metadata.releaseVersion -cne $env:RELEASE_TAG -or
            $metadata.sourceCommit -cne $env:SOURCE_COMMIT
          ) {
            throw "Release metadata does not match the validated tag and source commit."
          }

      - name: Attest release artifacts and integrity records
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            release-output/${{ needs.assemble_release.outputs.windows_signed == 'true' && 'fit-generator-windows-x64.exe' || 'fit-generator-windows-x64-UNSIGNED.exe' }}
            release-output/fit-generator-android.apk
            release-output/fit-generator-SHA256SUMS.txt
            release-output/fit-generator-sbom.spdx.json

      - name: Publish exactly one GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          WINDOWS_SIGNED: ${{ needs.assemble_release.outputs.windows_signed }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $windowsName = if ($env:WINDOWS_SIGNED -ceq "true") {
            "fit-generator-windows-x64.exe"
          } else {
            "fit-generator-windows-x64-UNSIGNED.exe"
          }
          $windowsPath = Join-Path "release-output" $windowsName
          $windowsHash = (Get-FileHash -LiteralPath $windowsPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $codeSigningUrl = (
            "https://github.com/$env:GITHUB_REPOSITORY/blob/" +
            "$env:SOURCE_COMMIT/CODE_SIGNING.md"
          )
          $signingNote = if ($env:WINDOWS_SIGNED -ceq "true") {
            "Windows EXE passed Authenticode verification."
          } else {
            "Windows artifact is explicitly UNSIGNED and Windows SmartScreen may warn. SHA-256: $windowsHash. See [CODE_SIGNING.md]($codeSigningUrl) before running it."
          }
          $notes = (
            "$signingNote`n`n" +
            "Android APK passed apksigner verification. Source commit: $env:SOURCE_COMMIT. " +
            "Verify downloads with fit-generator-SHA256SUMS.txt and the published provenance attestations. " +
            "A provenance attestation is not a platform code signature."
          )
          $assets = @(
            $windowsPath,
            "release-output/fit-generator-android.apk",
            "release-output/fit-generator-SHA256SUMS.txt",
            "release-output/fit-generator-release-metadata.json",
            "release-output/fit-generator-sbom.spdx.json",
            "release-output/THIRD-PARTY-NOTICES.txt"
          )
          & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "A GitHub Release already exists for this tag; refusing to replace or add assets."
          }
          & gh release create $env:RELEASE_TAG @assets `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --generate-notes `
            --title "FIT Generator $env:RELEASE_TAG" `
            --notes $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
